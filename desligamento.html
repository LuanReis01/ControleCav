<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cavalaria - Exoneração</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" />
<style>
    /* Documento inicialmente oculto */
    #showOnPrint {
        display: none;
        padding: 30px;
        min-height: 100vh;
        font-family: 'Courier New', Courier, monospace;
        background-image: url('fundo-boletim.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        font-size: 1.25em;
    }

    /* Centralizar assinatura */
    .assinaturas { text-align: center; margin-top: 50px; }

    /* Assinatura manuscrita */
    #assinaturaResp {
        font-family: 'Lucida Handwriting', 'Brush Script MT', cursive;
        font-size: 1.8em;
    }

    /* Cargo em datilografia */
    #assinatura, #cargoAssinatura { font-family: 'Courier New', Courier, monospace; }

    /* Navbar personalizada */
    .navbar-custom {
        background-image: url('fundo-navbar.png');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        padding: 20px 0;
    }

    /* Impressão */
    @media print {
        #hideOnPrint { display: none; }
        #showOnPrint { display: block !important; }
    }
</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            <div class="d-flex align-items-center">
                <img src="logo.png"
                    alt="Logo" style="width:125px; height:100px;" />
                <h2 class="ms-3">Cavalaria</h2>
            </div>
        </a>
    </div>
</nav>

<div class="container" id="container">

<!-- Documento -->
<section id="showOnPrint">
    <div class="row mt-3 justify-content-center">
        <div class="col-2">
            <img src="brasao1.png"
                alt="Brasão 1" width="100%" />
        </div>
        <div class="col-8 align-self-center">
            <h5 class="text-center fw-bold" style="font-size:3em;">CAVALARIA</h5>
        </div>
        <div class="col-2">
            <img src="brasao2.png"
                alt="Brasão 2" width="100%" />
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-12">
            <h5 class="text-center">COMUNICADO OFICIAL</h5>
            <h5 class="fw-bold text-center">COMITÊ DA CAVALARIA</h5>
        </div>
        <hr class="my-3" />
    </div>

    <div id="paragrafo1" class="mt-4">
        <div class="row mt-3 justify-content-center">
            <div class="col-md-6">
                <p id="p1"></p>
            </div>
        </div>
    </div>

    <div id="paragrafo2" class="mt-4">
        <div class="row mt-3 mb-5 justify-content-center">
            <div class="col-md-6">
                <p id="p2"></p>
            </div>
        </div>
    </div>

    <div class="row d-flex justify-content-center mt-5">
        <div class="col-4 ms-3 assinaturas">
            <p class="assinaturaResp" id="assinaturaResp"></p>
            <hr />
            <p id="assinatura" class="fw-bold">Assinatura do Responsável</p>
            <p id="cargoAssinatura" class="fst-italic"></p>
        </div>
    </div>

    <div class="row d-flex mt-3 justify-content-center">
        <div class="col-md-auto">
            <p id="dataAtual" class="fst-italic"></p>
        </div>
    </div>
</section>

<!-- Formulário -->
<section id="hideOnPrint">
    <div class="row mt-3">
        <div class="col-12">
            <h3 class="text-center">Emissão de Exoneração - Cavalaria</h3>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-md-4">
            <label for="nomeResponsavel" class="form-label">Nome do responsável:</label>
            <input type="text" class="form-control" id="nomeResponsavel" placeholder="Nome do responsável" />
        </div>
        <div class="col-md-4">
            <label for="cargoResponsavel" class="form-label">Cargo do responsável:</label>
            <input type="text" class="form-control" id="cargoResponsavel" placeholder="Cargo do responsável" />
        </div>
        <div class="col-md-4">
            <label for="nomeExonerado" class="form-label">Nome do exonerado:</label>
            <input type="text" class="form-control" id="nomeExonerado" placeholder="Nome do exonerado" />
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-md-4">
            <label for="cargoExonerado" class="form-label">Cargo do exonerado:</label>
            <input type="text" class="form-control" id="cargoExonerado" placeholder="Cargo do exonerado" />
        </div>
        <div class="col-md-4">
            <label for="dataExoneracao" class="form-label">Data da Exoneração:</label>
            <input type="date" class="form-control" id="dataExoneracao" />
        </div>
        <div class="col-md-4">
            <label for="motivoExoneracao" class="form-label">Motivo da Exoneração:</label>
            <textarea class="form-control" id="motivoExoneracao" rows="3" placeholder="Motivo"></textarea>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-6 d-grid">
            <button type="button" class="btn btn-dark" onclick="elaborarExoneracao()">Gerar documento</button>
        </div>
        <div class="col-6 d-grid">
            <button type="button" class="btn btn-outline-secondary" onclick="limparFormulario()">Limpar formulário</button>
        </div>
    </div>
</section>
</div>

<script>
function elaborarExoneracao() {
    const nomeR = document.getElementById('nomeResponsavel').value.trim();
    const cargoR = document.getElementById('cargoResponsavel').value.trim();
    const nomeE = document.getElementById('nomeExonerado').value.trim();
    const cargoE = document.getElementById('cargoExonerado').value.trim();
    const motivo = document.getElementById('motivoExoneracao').value.trim();
    const dataInput = document.getElementById('dataExoneracao').value;

    if (!nomeR || !nomeE) {
        alert('Preencha pelo menos o Nome do Responsável e o Nome do Exonerado.');
        return;
    }

    const texto1 = `Fica, por meio deste, declarada a exoneração de ${nomeE} do cargo de ${cargoE}, cessando imediatamente o exercício das funções.`;
    const texto2 = `Motivo da exoneração: ${motivo ? motivo : 'Sem observações adicionais.'}`;

    document.getElementById('p1').textContent = texto1;
    document.getElementById('p2').textContent = texto2;
    document.getElementById('assinaturaResp').textContent = nomeR;
    document.getElementById('cargoAssinatura').textContent = cargoR;

    let dataExibir = '';
    if (dataInput) {
        const [ano, mes, dia] = dataInput.split('-');
        const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
        dataExibir = `A lei prevalece, ${parseInt(dia)} de ${meses[parseInt(mes)-1]} de ${ano}`;
    } else {
        const hoje = new Date();
        const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
        dataExibir = `A lei prevalece, ${hoje.getDate()} de ${meses[hoje.getMonth()]} de ${hoje.getFullYear()}`;
    }

    document.getElementById('dataAtual').textContent = dataExibir;
    document.getElementById('showOnPrint').style.display = 'block';
}

function limparFormulario() {
    ['nomeResponsavel','cargoResponsavel','nomeExonerado','cargoExonerado','motivoExoneracao','dataExoneracao'].forEach(id => document.getElementById(id).value='');
    document.getElementById('p1').textContent='';
    document.getElementById('p2').textContent='';
    document.getElementById('assinaturaResp').textContent='';
    document.getElementById('cargoAssinatura').textContent='';
    document.getElementById('dataAtual').textContent='';
    document.getElementById('showOnPrint').style.display='none';
}
</script>

</body>
</html>
