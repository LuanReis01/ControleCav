<!DOCTYPE html>
<html lang="PT-BR">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cavalaria</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" />
<link rel="stylesheet" href="./css/style.css" />
<style>
    /* Inicialmente oculta o documento */
    #showOnPrint {
        display: none;
        padding: 30px;
        min-height: 100vh;
        font-family: 'Courier New', Courier, monospace;
        background-image: url('fundo-boletim.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    /* Centralizar assinatura */
    .assinaturas { text-align: center; }

    /* Apenas a assinatura real em cursivo */
    #assinaturaResp {
        font-family: 'Lucida Handwriting', 'Brush Script MT', cursive;
        font-size: 1.2em;
    }

    /* Linha de texto e cargo permanecem em datilografia */
    #assinatura, #cargoAssinatura { font-family: 'Courier New', Courier, monospace; }

    /* Navbar com imagem inteira */
    .navbar-custom {
        background-image: url('fundo-navbar.png');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        padding: 20px 0;
    }

    /* Estilo para impressão */
    @media print {
        #hideOnPrint { display: none; }
        #showOnPrint { display: block !important; }
    }
</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            <div class="d-flex align-items-center">
                <img src="logo.png" alt="Logo" style="width: 125px; height: 100px; padding-right: 0.8em;" class="d-flex align-top" />
                <h2 id="title" class="ms-3">Cavalaria</h2>
            </div>
        </a>
    </div>
</nav>

<div class="container" id="container">

<!-- Documento final -->
<section id="showOnPrint">
    <div class="row mt-3 justify-content-center">
        <div class="col-2">
            <img src="brasao1.png" alt="Brasão 1" width="100%" />
        </div>
        <div class="col-8 align-self-center">
            <h5 class="text-center fw-bold" style="font-size:3em;">CAVALARIA</h5>
        </div>
        <div class="col-2">
            <img src="brasao2.png" alt="Brasão 2" width="100%" />
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-12">
            <h5 class="text-center">COMUNICADO OFICIAL</h5>
            <h5 class="fw-bold text-center">ALTO COMANDO - CAVALARIA</h5>
        </div>
        <hr class="my-3" />
    </div>

    <div id="paragrafo1" class="mt-4">
        <div class="row mt-3 justify-content-center">
            <div class="col-md-6">
                <p id="p1"></p>
            </div>
        </div>
    </div>

    <div id="paragrafo2" class="mt-4">
        <div class="row mt-3 mb-5 justify-content-center">
            <div class="col-md-6">
                <p id="p2"></p>
            </div>
        </div>
    </div>

    <div class="row d-flex justify-content-center mt-5">
        <div class="col-4 ms-3 assinaturas">
            <p class="assinaturaResp" id="assinaturaResp"></p>
            <hr />
            <p id="assinatura" class="fw-bold">Assinatura do Responsável</p>
            <p id="cargoAssinatura" class="fst-italic"></p>
        </div>
    </div>

    <div class="row d-flex mt-3 justify-content-center">
        <div class="col-md-auto">
            <p id="dataAtual" class="fst-italic"></p>
        </div>
    </div>
</section>

<!-- Formulário -->
<section id="hideOnPrint">
    <div class="row mt-3">
        <div class="col-12">
            <h3 class="text-center">Emissão de documentos oficiais - Cavalaria</h3>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <p class="text-center">Preencha abaixo para a elaboração do documento.</p>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-md-4">
            <label for="nomeOficial" class="form-label">Nome do Oficial Responsável:</label>
            <input type="text" class="form-control" id="nomeOficial" placeholder="Nome do Oficial" />
        </div>
        <div class="col-md-4">
            <label for="cargoOficial" class="form-label">Cargo do Oficial Responsável:</label>
            <input type="text" class="form-control" id="cargoOficial" placeholder="Cargo do Oficial" />
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-md-4">
            <label for="dataDocumento" class="form-label">Data do Documento:</label>
            <input type="date" class="form-control" id="dataDocumento" />
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-md-6">
            <label for="relatoPrisao" class="form-label">Conteúdo:</label>
            <textarea class="form-control" id="relatoPrisao" rows="6" placeholder="Digite o texto do documento aqui..."></textarea>
        </div>
    </div>

    <div class="row my-5">
        <div class="col-12 d-grid">
            <button type="button" id="btnGerar" class="btn btn-dark" onclick="elaborarInformativo()">Gerar documento</button>
        </div>
    </div>
</section>
</div>

<script>
function elaborarInformativo() {
    const texto = document.getElementById('relatoPrisao').value.trim();
    const nomeOficial = document.getElementById('nomeOficial').value.trim();
    const cargoOficial = document.getElementById('cargoOficial').value.trim();
    const dataInput = document.getElementById('dataDocumento').value;

    if (!texto) return alert('Por favor, escreva algum conteúdo para gerar o documento.');
    if (!nomeOficial) return alert('Por favor, informe o nome do oficial responsável.');
    if (!cargoOficial) return alert('Por favor, informe o cargo do oficial responsável.');

    document.getElementById('p1').innerHTML = texto.replace(/\n/g, '<br>');
    document.getElementById('p2').innerHTML = '';
    document.getElementById('assinaturaResp').textContent = nomeOficial;
    document.getElementById('cargoAssinatura').textContent = cargoOficial;

    const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho',
        'agosto','setembro','outubro','novembro','dezembro'];

    let dataFormatada = '';
    if (dataInput) {
        const data = new Date(dataInput);
        dataFormatada = `${data.getDate()} de ${meses[data.getMonth()]} de ${data.getFullYear()}`;
    } else {
        const data = new Date();
        dataFormatada = `${data.getDate()} de ${meses[data.getMonth()]} de ${data.getFullYear()}`;
    }

    document.getElementById('dataAtual').textContent = `A lei prevalece, ${dataFormatada}`;
    document.getElementById('showOnPrint').style.display = 'block';
}
</script>

</body>
</html>
